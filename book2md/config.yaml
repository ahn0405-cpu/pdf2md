# 민사소송법 기본서·사례집 PDF → Markdown 변환 설정
#
# 정규화 규칙과 파서 프로파일은 전부 여기에 있다. 규칙을 고칠 때 코드를 건드리지 않는다.
# 값을 바꾼 뒤에는 반드시 `convert validate` 를 다시 돌린다.

# ─────────────────────────────────────────────────────────────
# 1. 절대 보존 대상 (§2)
# ─────────────────────────────────────────────────────────────
preserve:
  # 사건번호 부호. 긴 것부터 먼저 맞춰야 하므로 순서를 건드리지 말 것(재다 → 다).
  case_suffixes: [재다, 재도, 재후, 재허, 다, 도, 후, 허, 므, 두, 누, 마, 카, 그, 초, 오, 인, 부]
  # 검증에서 "알려진 부호"로 인정하는 목록 (§5.1)
  known_suffixes: [다, 도, 후, 허, 므, 두, 누, 마, 카, 그, 재다, 재도, 재후, 재허]
  # 4자리 연도로 인정할 범위
  year_min: 1945
  year_max: 2099

  mnemonic:
    # 두문자 한 덩어리의 글자 수 (예: 확객시전=4, 일외별명일=5)
    # 숫자가 섞이기도 한다: [송완불2괴]
    token_min: 2
    token_max: 6
    # 공백으로 나뉜 덩어리 수 (예: "일나시 나소시" = 2)
    max_tokens: 2
    # 대괄호 안 전체 길이 상한.
    #   두문자 : [일나시 나소시](7) [대채알판 피알대취](9) [확객시전](4)
    #   라벨   : [청구확장 취지 명백히 표시](14) [소송지연을 위한 기피신청](12)
    max_total_len: 10
    # ② 두문자와 ③ 판례 제목 라벨은 길이만으로 다 갈리지 않는다
    # ([반복적 재심청구] 는 8자짜리 라벨이다). 자리로 가른다:
    # 줄 맨 앞(목록 번호 뒤 포함)에 오는 대괄호는 라벨, 문장 가운데 오면 두문자다.
    # 지침 §1.5 ③ 의 예(`1) [청구확장 취지 명백히 표시]`)가 그 꼴이다.
    label_at_line_start: true
    # OCR 이 닫는 대괄호를 통째로 흘리는 일이 잦다: `(1) 원칙 ［일나시 나소시`(줄끝).
    # 안쪽 글자는 건드리지 않고 닫는 괄호만 되살린다. 되살린 자리는 전부 기록한다.
    repair_unclosed: true
    # 두문자로 보지 않을 낱말. 대괄호 안 한글이라도 이 낱말이 들어 있으면 건너뛴다.
    deny_words: [대법원, 전원합의체, 판결, 결정, 각주, 별지, 주석, 이하, 참조, 개정, 신설, 삭제, 미간행, 공보]

  star:
    # 사건번호 뒤 별표로 인정할 문자 (전부 ASCII '*' 로 정규화한다)
    chars: ["*", "＊", "﹡", "✱", "∗"]
    # 사건번호와 별표 사이에 허용할 공백 수
    max_gap: 2

  # §2.4 색상 강조 = 교재 범례 ⑤ 「답안 활용 가이드」
  color:
    # 색을 어디서 읽나.
    #   span  글자 색 (born-digital PDF)
    #   image 쪽 그림의 픽셀 (스캔본 + OCR 텍스트 레이어)
    #   auto  span 에 유채색이 없으면 image 로 넘어간다 (기본)
    source: auto
    # image 방식일 때 쪽을 렌더링할 해상도. 높이면 정확하지만 느려진다.
    image_dpi: 110
    # 픽셀 판정: 이보다 밝으면 종이(배경)로 본다
    ink_max: 205
    # 픽셀 판정: R·G·B 최대-최소 차이가 이보다 크면 유채색 픽셀
    chroma_min: 42
    # 글자 상자 안 잉크 픽셀 중 유채색 비율이 이 값을 넘으면 강조로 본다
    min_ratio: 0.34
    # 강조색은 '유채색'이다(§5.4). 회색 머리말·연회색 본문은 아무리 밝아도
    # 강조가 아니므로, 무채색이면 밝기와 무관하게 강조에서 뺀다.
    # 검정으로 볼 밝기(0~255). 유채색이어도 이보다 어두우면 본문으로 본다.
    black_max: 90
    # 무채색 판정: R·G·B 최대-최소 차이가 이보다 작으면 회색 계열
    gray_span: 24
    # 근접색 병합 거리 (RGB 유클리드). 이 안이면 같은 색으로 본다.
    merge_distance: 60
    # 팔레트 리포트에 색마다 실을 예문 수
    samples: 5
    # 마크업 매핑. 팔레트 리포트를 보고 사람이 확정한 뒤 여기를 고친다.
    #   emphasis: 유채색(답안 현출부) → ==텍스트==
    #   bold    : 검정 볼드          → **텍스트**
    markup:
      emphasis: "=="
      bold: "**"
    # 색 → 마크업 강제 지정 (팔레트 확정 후). 예: {"#1f4e9c": emphasis}
    overrides: {}

  footnote:
    # 각주 번호로 인정할 범위
    number_min: 1
    number_max: 4000
    # 각주 영역 판정: 본문 글자 크기 대비 이 비율보다 작으면 각주 후보 (좌표 파서 전용)
    size_ratio: 0.92
    # 페이지 아래쪽 이 비율 안에서만 각주 영역을 찾는다
    bottom_zone: 0.42
    # 위첨자 판정: 본문 대비 크기 비율과 최소 상승량(글자 크기 대비)
    superscript_size_ratio: 0.82
    superscript_rise: 0.12
    # 좌표가 없는 파서에서 각주 영역을 찾을 때 훑을 페이지 끝 줄 수
    markdown_tail_lines: 12
    # 좌표가 없는 파서에서, 그 페이지에 정의가 있는 번호만 본문 [^n] 으로 살린다
    inline_ref_from_numbers: true

# ─────────────────────────────────────────────────────────────
# 2. 정규화 (§4)
# ─────────────────────────────────────────────────────────────
normalize:
  # 사건번호 바로 앞에서 여는 괄호로 오인식된 문자 → '('  (§2.1, §4.1)
  # 주의: 문서 전체에 일괄 적용하지 않는다. 사건번호에 붙은 것만 고친다.
  open_brackets: ["＜", "〈", "≪", "《", "｛", "「", "『", "［", "[", "{", "〔", "（"]
  close_brackets: ["＞", "〉", "≫", "》", "｝", "」", "』", "］", "]", "}", "〕", "）"]

  # 전각 대괄호 → 반각. 두문자 대괄호 복구용이라 문서 전체에 적용한다. (§2.2)
  fullwidth_brackets: true
  # 전각 숫자·영문·공백 → 반각
  fullwidth_alnum: true

  # 두문자 대괄호로 복구할 짝 (안쪽이 두문자 모양일 때만 바꾼다)
  mnemonic_brackets:
    - ["{", "}"]
    - ["｛", "｝"]
    - ["〔", "〕"]
    - ["【", "】"]

  # 조문·편장절 안의 공백 제거: '제 265 조' → '제265조'
  article_units: [편, 장, 절, 관, 조, 항, 호, 목, 목차, 심급]

  # 지울 잔여 노이즈. 지운 자리는 전부 warnings.md 에 남는다. (§4.1)
  noise_chars: ["¤", "°］", "°]", "￣", "", "", "", "�", "", ""]
  # 낱글자 노이즈: 한글 사이에 홀로 끼어든 아래 글자를 지운다 (앞뒤가 공백일 때만)
  noise_tokens: ["셔", "°", "ﾂ", "「", "」"]

  collapse_spaces: true
  # 날짜 뒤에 붙은 이상 문자를 떼어낸다 (§4.2)
  fix_dates: true
  # 날짜 뒤에 한글이 바로 붙은 경우('2011. 4. 26로'). 한글을 지우는 건 위험해서
  # 기본값은 지우지 않고 warnings 에만 남긴다. strip 으로 바꾸면 지운다.
  date_trailing_hangul: warn      # warn | strip

# 잔여 노이즈 판정: 아래에 없는 문자는 노이즈로 세어 리포트에 올린다 (§5.6)
noise_scan:
  allowed_ranges:
    - [0x0020, 0x007E]      # 아스키
    - [0xAC00, 0xD7A3]      # 한글 음절
    - [0x1100, 0x11FF]      # 한글 자모
    - [0x3130, 0x318F]      # 호환 자모
    - [0x4E00, 0x9FFF]      # 한자
    - [0xF900, 0xFAFF]      # 한자 호환
    - [0x3000, 0x303F]      # CJK 문장부호
    - [0x2160, 0x217F]      # 로마숫자 Ⅰ Ⅱ Ⅲ
    - [0x2460, 0x24FF]      # 원문자 ① ② ③
    - [0x2018, 0x201D]      # 따옴표
    - [0x2013, 0x2015]      # 대시
  allowed_chars: "·※→←↔≪≫「」『』〈〉§¶†‡…‰°∼~№㈜㎡ⓐ*"


# ─────────────────────────────────────────────────────────────
# 2.5 교재 범례 요소 (§1.5, §4.3~4.7)
# ─────────────────────────────────────────────────────────────
legend:
  # ⑩ 옆번호: 절 제목 우측 여백의 강의교안 번호 (사례집 번호 E-5 와 다른 체계)
  sidenote:
    # OCR 이 소문자 s 를 대문자 S 로 흘리기도 한다(SE-5). 둘 다 받는다.
    pattern: '^[sS][A-Z]-\d{1,3}$'
    # 본문 오른쪽 끝에서 이 비율보다 더 오른쪽에서 시작하는 블록을 여백으로 본다
    margin_ratio: 0.78
    # 옆번호를 어느 헤딩에 붙일지: 세로 거리가 이 안(pt)일 때만 같은 줄로 본다.
    # 넉넉히 잡으면 편·장 제목이 절의 옆번호를 가로챈다.
    match_tolerance: 12
    # 여백에서 뗀 뒤 남은 본문에서 다시 이 꼴이 보이면 병합 사고다 (§5.5)
    merge_suspect: '[sS][A-Z]-\d{3,}|[sS][A-Z]-\d+\s*\d'

  # ⑨ 기출연도: 제목 뒤 (11) → 2011. 복수는 (15)(20)
  exam_year:
    pattern: '\((\d{2})\)'
    century_split: 50        # 50 이상이면 19xx, 미만이면 20xx

  # ⑧ 보너스 논점 박스
  bonus:
    marker: '☑'
    # ☑ 가 깨져 들어오는 꼴. 줄 맨 앞에 홀로 있을 때만 ☑ 로 되돌린다.
    misread: ['口', '囗', '☐', '▣', '■', 'ⓥ', 'Ⅴ']
    # 줄 맨 앞 '0 ' / 'V ' 도 오인식 후보로 본다 (뒤에 한글 제목이 올 때만)
    misread_ascii: ['0', 'V', 'v', 'ㅁ']
    # 박스 한 개가 이보다 길면 박스가 아니라고 보고 끊는다
    max_lines: 24

  # ③ 판례 제목 라벨: 1) [청구확장 취지 명백히 표시] ... (91다43695*)
  case_label:
    pattern: '^(?:\d+\s*[).]|\(\s*\d+\s*\))\s*\[(?P<label>[^\]]{2,40})\]'

  # ① 논점 윤곽 띠: 절 상단의 의의-내용-예외-효과
  outline:
    # 절 상단의 '의의 - 내용 - 예외 - 효과 + 관련논점' 띠.
    # 실물에는 '& ' '◎ ' 같은 표시가 앞에 붙는다.
    separator: '[-–—>»/·+]'
    lead_marker: '^[&◎@※＆⊙○●\s]+'
    keywords: [의의, 내용, 요건, 예외, 효과, 관련논점, 취지, 절차, 범위, 한계,
               소송물, 기판력, 방식, 시기, 판단, 심리, 유형, 성질]
    min_items: 3
    # 한 토막의 최대 길이. 이보다 길면 띠가 아니라 문장이다.
    max_item_len: 10
    # 아는 낱말이 최소 이만큼은 있어야 한다
    min_known: 1

# §4.6 사례집 추출 검수. **자동 치환하지 않는다.** 세어서 리포트에만 올린다.
extraction_qa:
  patterns:
    - {name: 청구, regex: '정구|정\s*\+\s*구|청\s*\+\s*구', note: '청구 오인식 의심'}
    - {name: 결과, regex: '졀과|걸과', note: '결과 오인식 의심'}
    - {name: 구한다, regex: '수한다', note: '구한다 오인식 의심'}
    - {name: 로마자, regex: '(?<![가-힣])[ⅰｉ](?=\s*\))', note: 'i) 체계 오인식 의심'}
    - {name: 判例, regex: '判列|判倒|判例\s*例', note: '判例 오인식 의심'}
  # 페이지당 이 건수를 넘으면 "파서를 바꿔라" 로 판정한다 (자동 치환 아님)
  swap_parser_threshold: 2

# ─────────────────────────────────────────────────────────────
# 3. 파서 프로파일 (§3.2)
# ─────────────────────────────────────────────────────────────
parsers:
  # 진단 결과 → 파서 우선순위
  by_diagnosis:
    text_single_column: [pymupdf, pymupdf4llm, marker]
    text_two_column: [pymupdf, mineru, marker]
    scanned: [paddleocr, upstage]

profiles:
  textbook:
    label: 기본서
    split: chapter          # 장(章) 단위
    split_max_bytes: 409600 # 400KB 넘으면 절 단위로 재분할 (§6.3)
    columns: 1              # 실물 확인 결과 1단 (§3.1)
    emphasis: true          # 색상 → 마크다운 강조 (§2.4)
    sidenote: true          # 우측 여백 옆번호 분리 (§4.3)
    headings:
      - {level: 1, pattern: '^제\s*(\d+)\s*편(?![가-힣])'}
      - {level: 2, pattern: '^제\s*(\d+)\s*장(?![가-힣])'}
      - {level: 2, pattern: '^CHAPTER\s+(\d+)\b'}
      - {level: 3, pattern: '^제\s*(\d+)\s*절(?![가-힣])'}
      # 이 교재는 논점마다 세 자리 번호를 단다: '051 시효중단'
      - {level: 3, pattern: '^(\d{3})\s+(?![\d)])\S.{0,30}$'}
      - {level: 4, pattern: '^([ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]|[IVX]{1,5})\s*[.·]\s*'}
    # 로마숫자 제목 아래에서 'N.' 은 절이 아니라 굵은 소항목이다 (§6.1)
    bold_item: '^(\d+)\s*\.\s*'
    # 절 제목으로 볼 'N.' (로마숫자 제목 앞에 나오고 줄이 짧을 때)
    section_item: '^(\d+)\s*\.\s*'
    section_max_len: 40
    # 각주를 모아 붙일 단위: 이 수준 이하 헤딩이 새로 시작하면 앞 각주를 쏟아낸다
    footnote_flush_level: 4
    # 헤딩 옆 사례집 참조: [sE-81] / (sE-81) / sE-81
    casebook_ref: '[\[(（]?\s*(s[A-Z]-\d+(?:\s*,\s*s?[A-Z]?-?\d+)*)\s*[\])）]?'

  casebook:
    label: 사례집
    split: group            # 문제 그룹(E, F...) 단위
    split_max_bytes: 0      # 재분할하지 않음
    columns: 1
    emphasis: true
    sidenote: false
    # §4.7 문제 지문 박스. 테두리 안이라 좌우 여백이 본문보다 안쪽으로 들어온다.
    prompt_box:
      indent_ratio: 0.04    # 본문보다 이 비율 이상 안쪽이면 박스로 본다
      max_lines: 40
    problem: '^([A-Z])\s*-\s*(\d+)\s*\.?\s*(.*)$'
    # 문제 지문 / 답안 구분 표지
    prompt_markers: [문제, 【문제】, "[문제]", 사례, 설문]
    answer_markers: [답안, 【답안】, "[답안]", 모범답안, 예시답안]
    answer_headings:
      - {level: 3, pattern: '^(\d+)\s*\.\s*'}
      - {level: 4, pattern: '^\(\s*(\d+)\s*\)\s*'}
    # 배점: (10점) / 10점 / [2.5] / (4) / 0.5 — 반드시 줄 끝에서만 본다.
    # 앞이 글자·숫자면 배점이 아니다. 이 조건이 없으면 '(74다1557)' 의 1557 을
    # 배점으로 뜯어내 사건번호를 부순다.
    score: '(?<![\w가-힣])[\[(（]?\s*(\d+(?:\.\d+)?)\s*(?:점)?\s*[\])）]?\s*$'
    # 배점으로 인정할 최대값. 이보다 크면 배점이 아니라고 본다.
    score_max: 50
    footnote_flush_level: 2

# ─────────────────────────────────────────────────────────────
# 4. 머리말·꼬리말 (본문이 아니므로 뺀다. 각주 영역과 혼동하지 않도록 상단만)
# ─────────────────────────────────────────────────────────────
running:
  strip_header: true
  strip_page_number: true
  header_zone: 0.08

# ─────────────────────────────────────────────────────────────
# 5. 검증 판정 기준 (§5.6)
# ─────────────────────────────────────────────────────────────
validation:
  fail_on:
    case_format_errors: 0
    star_mismatch: 0
    mnemonic_mismatch: 0
    footnote_mismatch: 0
  warn_on:
    noise_per_page: 3

# ─────────────────────────────────────────────────────────────
# 6. 문단 잇기
#   space  줄 사이에 공백 하나 (기본)
#   none   붙인다 (원문에 없던 글자를 넣지 않아야 할 때)
#   break  줄바꿈 유지 (완전 무손실)
# ─────────────────────────────────────────────────────────────
paragraph:
  join: space
