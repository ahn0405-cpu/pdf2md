# ─────────────────────────────────────────────────────────────
# 민사소송법 (윤곽 기본서·사례집 상/하) — 교재별 설정
# ─────────────────────────────────────────────────────────────
# 공통 설정 위에 얹는다. 여기 있는 것만 갈아 끼워진다.
#
#   convert --config config.yaml --config config-민소법.yaml all …
#   convert --config config.yaml,config-민소법.yaml all …
#
# **교재를 넘어가면 해를 끼치는 것만 여기 둔다.** 사람이 그 교재 원문에서
# 확인한 정정, 그 책의 제목, 그 판형에서만 관찰된 오인식.

# 머리말이 절 제목이 되는 것을 막는다. 영역 판정이 놓친 자리를 글자로 한 번
# 더 막는 것이라 책 제목이 그대로 들어간다.
running:
  never_heading: ['윤곽\s*민사\s*소송법']

profiles:
  textbook:
    # 기본서에서만 'H' 를 'II' 로 본다. 사례집은 A~Q 를 문제 번호로 쓰므로
    # 여기에 넣으면 'H-3' 같은 문제 번호가 절 제목이 된다.
    roman_heads_extra:
      II: ['H']

corrections:
  # 아래 넷은 앞뒤 문맥에서 원래 글자가 하나로 정해지는 것들이다.
  #   '仏' 은 여는 괄호 '(' 와 연도 첫 자리 '2' 가 함께 뭉개진 자리다.
  #   '디끄' 도 마찬가지다.
  - {find: "仏018다210539", to: "(2018다210539", note: "여는 괄호+연도 첫 자리 유실"}
  - {find: "仏006다80322",  to: "(2006다80322",  note: "여는 괄호+연도 첫 자리 유실"}
  - {find: "디끄022그534",  to: "(2022그534",    note: "여는 괄호+연도 첫 자리 유실"}
  - {find: "(830카95",      to: "(83다카95",     note: "다 → 0 오인식"}

  # 아래는 수정 요청 #01 §P2-2 에서 사람이 원본과 대조해 확정한 것들이다.
  # 프로그램이 스스로 맞춤법을 고치는 일은 없다(§4.8). 여기 적힌 것만 고친다.
  - {find: "발생하는지 않고", to: "발생하지 않고",   note: "P2-2 ☑ 박스 1. 최고의 효력"}
  - {find: "셔 채권자가",     to: "채권자가",        note: "P2-2 ☑ 박스 2."}
  - {find: "2016. 4. 26. 경과함으로써", to: "2016. 4. 26.이 경과함으로써",
     note: "P2-2 각주 266 — 조사 '이' 유실"}
  - {find: "」명시적 일부청구", to: "[명시적 일부청구", note: "P2-2 사례집 E-2 제목"}
  - {find: "손해배상청구 소송물｝", to: "손해배상청구 소송물]", note: "P2-2 사례집 E-4 제목"}
  - {find: "＜96다:30113)",   to: "(96다30113)",     note: "P2-2 각주 267"}
  - {find: "불할청구",        to: "분할청구",        note: "P2-2 사례집 E-2"}
  - {find: "완정되었다",      to: "완성되었다",      note: "P2-2 사례집 E-6"}

  # 아래 둘은 원문을 편 사람이 확정해 준 것이다 (2026-08-30).
  #   · 유치권 남용 판례의 연도는 2011 이었다.
  #   · '없다189다카4045)' 는 여는 괄호 '(' 가 '1' 로 읽힌 자리다.
  # 괄호를 걸지 않는다. 원문의 여는 괄호는 '＜' 로 흘러나오는데 그 복원은
  # 정정보다 나중에 돌기 때문이다. 사건번호만 걸면 괄호가 무엇이든 만난다.
  - {find: "201다84298",   to: "2011다84298",  note: "연도 첫 자리 유실 — 사람 확인"}
  - {find: "189다카4045",   to: "(89다카4045",  note: "여는 괄호가 1 로 오인식 — 사람 확인"}

# 목차 줄은 제목이 아니다. '.....188' 처럼 점선과 쪽번호로 끝난다.
# 이걸 안 거르면 목차 한 쪽이 통째로 문제 헤딩이 되어 빈 섹션이 쏟아진다.
