# 특허법 기본서(·사례집) PDF → Markdown 변환 설정
#
# `config.yaml`(민사소송법)에서 갈라져 나왔다. 프로그램은 교재를 가리지 않고,
# 교재마다 다른 것은 전부 여기에 있다 (HANDOFF.md).
#
#     convert --config config-patent.yaml diagnose "특허법 PDF 폴더" --out 특허출력
#
# 정규화 규칙과 파서 프로파일은 전부 여기에 있다. 규칙을 고칠 때 코드를 건드리지 않는다.
# 값을 바꾼 뒤에는 반드시 `convert validate` 를 다시 돌린다.
#
# ── 진단을 보고 채워야 할 자리 ────────────────────────────────
# 아래 다섯 자리는 **실물을 보기 전에는 정할 수 없다.** `TODO(진단)` 로 표시해
# 두었다. `convert --config config-patent.yaml diagnose` 와 `convert probe` 로
# 확인한 뒤 채운다. 민소법 값을 그대로 둔 채 전체를 돌리지 말 것.
#
#   running.never_heading            책 제목 (머리말이 절 제목이 되는 것을 막는다)
#   legend.outline                   논점 윤곽 띠 — 이 파이프라인에서 제일 중요한 설정
#   legend.sidenote.pattern          옆번호 모양
#   profiles.textbook.headings       절 번호 모양 · 논점 번호 모양
#   profiles.textbook.split_prefer   장 나누기 경계
#
# 사람이 확정한 정정 목록은 비워 두었다. 민소법 교재에서 확인한 것이라
# 특허법 교재에 그대로 쓰면 없는 자리를 고친다.

# ─────────────────────────────────────────────────────────────
# 1. 절대 보존 대상 (§2)
# ─────────────────────────────────────────────────────────────
preserve:
  # 사건번호 부호. 긴 것부터 먼저 맞춰야 하므로 순서를 건드리지 말 것(재다 → 다).
  # 두 글자 부호(다카·나카…)를 한 글자 부호보다 먼저 맞춰야 '87다카1416' 이
  # '87다' 로 잘리지 않는다. 정규식을 만들 때 길이순으로 정렬하므로 순서는
  # 여기 적힌 대로가 아니라 길이가 결정한다.
  #
  # 특허법에서 더 붙인 것:
  #   후·허  대법원·특허법원. 민소법 설정에 이미 있었다.
  #   당     특허심판원 당사자계 (무효·권리범위확인)   2019당123
  #   원     특허심판원 결정계 (거절결정불복)          2020원456
  #   취·정  취소·정정심판                            2021취1 / 2018정100
  #   재당·재원·재취·재정  재심
  #
  # 일련번호는 정규식이 `\d+` 라 자릿수 제한이 없다. '2019후10500'(5자리)은
  # 손댈 것이 없다 — 실측으로 확인했다.
  #
  # ※ '원' 은 금액과 생김새가 겹친다. 콤마가 있으면('1,000원3') 정규식이 막고
  #   숫자가 바로 뒤에 붙어야 하므로 대부분 걸러지지만, '12원34' 꼴은 사건번호로
  #   잡힌다. **`_reports/caselist-*.txt` 에서 `\d{2,4}원\d+` 을 한 번 훑어보고**
  #   금액이 섞였으면 '원' 을 빼거나 corrections 로 처리한다. 프로그램은 이것을
  #   스스로 가르지 못한다.
  case_suffixes: [재다, 재도, 재후, 재허, 재당, 재원, 재취, 재정,
                  다카, 나카, 가카, 다, 도, 후, 허, 므,
                  두, 누, 마, 카, 그, 초, 오, 인, 부, 모, 스, 즈,
                  당, 원, 취, 정]
  # 검증에서 "알려진 부호"로 인정하는 목록 (§5.1)
  known_suffixes: [다, 도, 후, 허, 므, 두, 누, 마, 카, 그, 다카, 나카, 가카,
                   재다, 재도, 재후, 재허, 모, 스, 즈, 초, 오,
                   당, 원, 취, 정, 재당, 재원, 재취, 재정]
  # 4자리 연도로 인정할 범위
  year_min: 1945
  year_max: 2099

  # 프론트매터 articles: 에 법령명을 함께 실을지.
  #
  # 민소법 교재는 한 법만 다루므로 '제265조' 로 충분했다. 특허법 교재는
  # 특허법·실용신안법·디자인보호법이 한 쪽에 섞여 나와 '제29조' 만으로는
  # 어느 법인지 정해지지 않는다. 여기 적은 이름이 조문 **바로 앞에 붙어
  # 있을 때만** 함께 싣는다. 앞 문단의 법령명을 이어 붙이지는 않는다 —
  # 그건 원문에 없는 것을 지어내는 일이다(§4.8).
  #
  # '구 특허법 제29조' 의 '구' 는 개정 전 법이라 조문 내용이 다르다. 남긴다.
  # 목록을 비우면(`law_names: []`) 민소법과 똑같이 조문만 싣는다.
  article:
    law_names: [특허법, 실용신안법, 디자인보호법, 상표법, 발명진흥법,
                부정경쟁방지법, 특허법시행령, 특허법시행규칙, 민법, 민사소송법]

  mnemonic:
    # 두문자 한 덩어리의 글자 수 (예: 확객시전=4, 일외별명일=5)
    # 숫자가 섞이기도 한다: [송완불2괴]
    token_min: 2
    token_max: 6
    # 공백으로 나뉜 덩어리 수 (예: "일나시 나소시" = 2)
    max_tokens: 2
    # 대괄호 안 전체 길이 상한.
    #   두문자 : [일나시 나소시](7) [대채알판 피알대취](9) [확객시전](4)
    #   라벨   : [청구확장 취지 명백히 표시](14) [소송지연을 위한 기피신청](12)
    max_total_len: 10
    # ② 두문자와 ③ 판례 제목 라벨은 길이만으로 다 갈리지 않는다
    # ([반복적 재심청구] 는 8자짜리 라벨이다). 자리로 가른다:
    # 줄 맨 앞(목록 번호 뒤 포함)에 오는 대괄호는 라벨, 문장 가운데 오면 두문자다.
    # 지침 §1.5 ③ 의 예(`1) [청구확장 취지 명백히 표시]`)가 그 꼴이다.
    label_at_line_start: true
    # 대괄호 안이 조문번호면 두문자가 아니다. 따로 모아 articles 로 남긴다.
    # 조문 표기는 두문자가 아니다. 실물에서 이런 꼴들이 새어 들어왔다:
    #   [민법 제272조]  [제343조 후단]  [제402]  [제62]  [동조 2항]
    # 그래서 앞에 법령명이 와도, 뒤에 말이 붙어도, '조' 가 없어도 잡는다.
    article_pattern: '^\s*(?:[가-힣]{2,6}\s+)?(?:제\s*\d+|동조)(?:\s*[조죄좌])?(?:의\s*\d+)?(?:\s*제?\s*\d+\s*[항호목])*(?:\s+[가-힣]{1,4})?\s*$'
    # OCR 이 닫는 대괄호를 통째로 흘리는 일이 잦다: `(1) 원칙 ［일나시 나소시`(줄끝).
    # 안쪽 글자는 건드리지 않고 닫는 괄호만 되살린다. 되살린 자리는 전부 기록한다.
    repair_unclosed: true
    # 대괄호를 통째로 잃은 두문자 후보를 warnings 에 올릴지.
    # 제목 낱말 뒤에 두문자가 바로 오는 것이 흔해서('반소이익 [이부실본기]')
    # 오탐이 대부분이다. 두문자 유실은 mnemonics-*.txt 전수 목록과
    # crosscheck-*.md 로 잡는 편이 낫다(§5.1, §5.3). 필요하면 켠다.
    warn_bare: false
    # 두문자로 보지 않을 낱말. 대괄호 안 한글이라도 이 낱말이 들어 있으면 건너뛴다.
    deny_words: [대법원, 전원합의체, 판결, 결정, 각주, 별지, 주석, 이하, 참조, 개정, 신설, 삭제, 미간행, 공보]

  star:
    # 사건번호 뒤 별표로 인정할 문자 (전부 ASCII '*' 로 정규화한다)
    chars: ["*", "＊", "﹡", "✱", "∗"]
    # 사건번호와 별표 사이에 허용할 공백 수
    max_gap: 2

  # §2.4 색상 강조 = 교재 범례 ⑤ 「답안 활용 가이드」
  color:
    # 색을 어디서 읽나.
    #   span  글자 색 (born-digital PDF)
    #   image 쪽 그림의 픽셀 (스캔본 + OCR 텍스트 레이어)
    #   auto  span 에 유채색이 없으면 image 로 넘어간다 (기본)
    source: auto
    # image 방식일 때 쪽을 렌더링할 해상도. 높이면 정확하지만 느려진다.
    #   auto  쪽에 박힌 그림의 실제 dpi 에 맞춘다 (image_dpi_max 로 상한)
    #   숫자  그 값으로 고정
    # 원본보다 높여 봐야 없는 화소를 늘리는 것뿐이라 얻을 게 없다.
    image_dpi: auto
    image_dpi_max: 200
    image_dpi_min: 100
    # 픽셀 판정: 이보다 밝으면 종이(배경)로 본다
    ink_max: 205
    # 픽셀 판정: R·G·B 최대-최소 차이가 이보다 크면 유채색 픽셀
    # 스캔 + JPEG 를 거치면 청색 잉크가 상당히 바래므로 넉넉히 잡는다 (§P0-2)
    chroma_min: 30
    # 글자 상자 안 잉크 픽셀 중 유채색 비율이 이 값을 넘으면 강조로 본다.
    # 실측(171쪽): 진짜 청색 낱말은 0.88~1.00, **굵은 검정**은 0.08~0.28 에
    # 몰린다 — 굵은 획 가장자리에 JPEG 가 만든 색 번짐이다. 0.30~0.65 가
    # 통째로 비어 있으므로 그 골짜기에 문턱을 놓는다. 낮추면 굵은 검정이
    # 청색으로 둔갑해 **없는 강조를 지어낸다**.
    min_ratio: 0.45
    # 이력 판정의 아래 문턱. 저자는 낱말이 아니라 **구절**을 칠하므로, 확실한
    # 낱말 사이에 낀 애매한 낱말은 같은 구절로 본다. 혼자 있으면 버린다.
    min_ratio_weak: 0.32
    # 본문 강조는 청색이 아니라 **검정 굵은 글씨**다 (171쪽 실측). 스캔본이라
    # OCR 이 붙여 준 글꼴 속성은 지어낸 것이라 못 쓰므로, 그림에서 잰 잉크
    # 밀도를 같은 줄의 가운뎃값과 견준다.
    #
    # **기본은 끔.** 수정 요청 #01(개정)에서 색상·강조는 뒤 AI 가 직접 판단하기로
    # 정해져 필수가 아니다. 굵기를 살리려면 켜고 `convert probe --color <쪽>
    # --image anno.png` 로 문턱을 맞출 것.
    bold_from_image: false
    # 같은 줄 가운뎃값의 이 배수를 넘으면 굵은 글씨로 본다
    bold_density_ratio: 1.45
    # 줄에 이보다 낱말이 적으면 가운뎃값을 믿을 수 없어 굵기를 판정하지 않는다
    bold_min_words: 6
    # 색을 모아 두는 격자 한 칸의 크기(pt). 낱말 상자보다 충분히 작아야
    # 옆 낱말의 색이 넘어오지 않는다. 작을수록 정확하고 느리다.
    grid_cell: 1.5
    # 강조색은 '유채색'이다(§5.4). 회색 머리말·연회색 본문은 아무리 밝아도
    # 강조가 아니므로, 무채색이면 밝기와 무관하게 강조에서 뺀다.
    # 검정으로 볼 밝기(0~255). 유채색이어도 이보다 어두우면 본문으로 본다.
    black_max: 90
    # 무채색 판정: R·G·B 최대-최소 차이가 이보다 작으면 회색 계열
    gray_span: 24
    # 근접색 병합 거리 (RGB 유클리드). 이 안이면 같은 색으로 본다.
    # 그림에서 읽은 색은 글자마다 평균값이 조금씩 달라 넉넉히 묶어야 한다.
    merge_distance: 95
    # 팔레트 리포트에 색마다 실을 예문 수
    samples: 5
    # 마크업 매핑. 팔레트 리포트를 보고 사람이 확정한 뒤 여기를 고친다.
    #   emphasis: 유채색(답안 현출부) → ==텍스트==
    #   bold    : 검정 볼드          → **텍스트**
    markup:
      emphasis: "=="
      bold: "**"
    # 색 → 마크업 강제 지정 (팔레트 확정 후). 예: {"#1f4e9c": emphasis}
    overrides: {}

  footnote:
    # 각주 번호로 인정할 범위
    number_min: 1
    number_max: 4000
    # 각주 영역 판정: 본문 글자 크기 대비 이 비율보다 작으면 각주 후보 (좌표 파서 전용)
    size_ratio: 0.92
    # 페이지 아래쪽 이 비율 안에서만 각주 영역을 찾는다
    bottom_zone: 0.42
    # 위첨자 판정: 본문 대비 크기 비율과 최소 상승량(글자 크기 대비)
    superscript_size_ratio: 0.82
    superscript_rise: 0.12
    # 좌표가 없는 파서에서 각주 영역을 찾을 때 훑을 페이지 끝 줄 수
    markdown_tail_lines: 12
    # 좌표가 없는 파서에서, 그 페이지에 정의가 있는 번호만 본문 [^n] 으로 살린다
    inline_ref_from_numbers: true

# ─────────────────────────────────────────────────────────────
# 2. 정규화 (§4)
# ─────────────────────────────────────────────────────────────
normalize:
  # 사건번호 바로 앞에서 여는 괄호로 오인식된 문자 → '('  (§2.1, §4.1)
  # 주의: 문서 전체에 일괄 적용하지 않는다. 사건번호에 붙은 것만 고친다.
  open_brackets: ["＜", "〈", "≪", "《", "｛", "「", "『", "［", "[", "{", "〔", "（"]
  close_brackets: ["＞", "〉", "≫", "》", "｝", "」", "』", "］", "]", "}", "〕", "）"]

  # 전각 대괄호 → 반각. 두문자 대괄호 복구용이라 문서 전체에 적용한다. (§2.2)
  fullwidth_brackets: true
  # 전각 숫자·영문·공백 → 반각
  fullwidth_alnum: true
  # 전각 괄호 （） → 반각 (). 이 교재 OCR 이 조문 인용에서 전각을 자주 낸다.
  fullwidth_parens: true

  # 두문자 대괄호로 복구할 짝 (안쪽이 두문자 모양일 때만 바꾼다)
  mnemonic_brackets:
    - ["{", "}"]
    - ["｛", "｝"]
    - ["〔", "〕"]
    - ["【", "】"]

  # 조문·편장절 안의 공백 제거: '제 265 조' → '제265조'
  article_units: [편, 장, 절, 관, 조, 항, 호, 목, 목차, 심급]
  # 항목 번호와 마침표 사이 공백 제거: '1 .문제점' → '1.문제점'
  # 스캔본에서 번호와 제목이 다른 조각으로 떨어져 생긴다.
  item_number_space: true
  # 번호와 제목 사이 공백 복원: 'III.중복소제기' → 'III. 중복소제기'
  # 종이에는 공백이 있는데 OCR 이 삼킨 자리다. 줄 맨 앞 + 번호 + 구분점 +
  # 한글일 때만 넣는다. 손댄 자리는 02_changes.jsonl 에 남는다.
  heading_number_space: true

  # 로마자 절 번호 되살리기 (§P0-1).
  # 'III' 이 'Ill'(소문자 L 두 개)로 흘러나오면 헤딩 판정에서 탈락하고
  # 그 절 전체가 목차에서 사라진다. **줄 맨 앞 + 뒤에 '.' 또는 공백 + 한글**
  # 일 때만 고친다. 문장 속 'l' 은 건드리지 않는다.
  roman_heads:
    # '।' 은 데바나가리 단다(U+0964). OCR 이 로마자 I 를 이것으로 읽는다.
    # 실물 기본서에서 48개 논점의 'I. 의의' 가 통째로 이것 때문에 사라졌다.
    I:    ['l', '|', 'Ⅰ', '¡', '１', '।', 'ㅣ', '⌐', '′', 'i']
    II:   ['ll', 'Il', 'lI', 'Ⅱ', '11']
    III:  ['Ill', 'lll', 'IIl', 'IlI', 'lIl', 'llI', 'Ⅲ', '111']
    IV:   ['Ⅳ', 'N', 'lV', 'IＶ']
    V:    ['Ⅴ', 'ν']
    VI:   ['Ⅵ', '씨', 'Vl', 'vl']
    VII:  ['Ⅶ', 'Vll', 'VIl']
    VIII: ['Ⅷ', 'Vlll']
    IX:   ['Ⅸ', 'lX']
    X:    ['Ⅹ']

  # 번호 뒤 구분점으로 인정할 글자. 마침표 자리에 OCR 이 흘려 놓는 것들이다.
  # '•'(U+2022) 는 '·'(U+00B7) 과 생김새가 같아도 다른 글자다. 찾은 것은
  # 마침표로 되돌린다 — 종이에 찍힌 것이 마침표다.
  head_seps: ['.', ',', '·', '•', '‧', '∙', '・']

  # 조문번호 안의 '죄·좌' 를 '조' 로 (제N조 꼴 안에서만)
  article_ocr: true

  # 제목·각주의 괄호 오인식 (§P2-2).
  # 'E-2. 」명시적 일부청구 …]' 처럼 여는 대괄호가 닫는 괄호 글자로 흘러나온다.
  # 두문자가 아니라 긴 제목이라 두문자 복구가 못 잡는다. **한 줄 안에서 짝이
  # 맞아떨어질 때만** 고치고, 고친 자리는 전부 기록에 남긴다.
  repair_title_brackets: true

  # 사건번호 안에 낀 잡글자 (§P1-1).
  # '96다:30113' 처럼 부호와 일련번호 사이에 콜론이 끼면 사건번호 정규식이
  # 통째로 빗나가 목록에서 사라진다. **연도+부호 바로 뒤 + 숫자 앞**일 때만
  # 지운다. 숫자 자체는 손대지 않는다.
  case_inner_seps: [":", ";", "：", "；", "·"]


  # 지울 잔여 노이즈. 지운 자리는 전부 warnings.md 에 남는다. (§4.1)
  noise_chars: ["¤", "°］", "°]", "￣", "", "", "", "�", "", ""]
  # 낱글자 노이즈: 한글 사이에 홀로 끼어든 아래 글자를 지운다 (앞뒤가 공백일 때만)
  noise_tokens: ["셔", "°", "ﾂ", "「", "」"]

  collapse_spaces: true
  # 날짜 뒤에 붙은 이상 문자를 떼어낸다 (§4.2)
  fix_dates: true
  # 날짜 뒤에 한글이 바로 붙은 경우('2011. 4. 26로'). 한글을 지우는 건 위험해서
  # 기본값은 지우지 않고 warnings 에만 남긴다. strip 으로 바꾸면 지운다.
  date_trailing_hangul: warn      # warn | strip

# 잔여 노이즈 판정: 아래에 없는 문자는 노이즈로 세어 리포트에 올린다 (§5.6)
noise_scan:
  allowed_ranges:
    - [0x0020, 0x007E]      # 아스키
    - [0xAC00, 0xD7A3]      # 한글 음절
    - [0x1100, 0x11FF]      # 한글 자모
    - [0x3130, 0x318F]      # 호환 자모
    - [0x4E00, 0x9FFF]      # 한자
    - [0xF900, 0xFAFF]      # 한자 호환
    - [0x3000, 0x303F]      # CJK 문장부호
    - [0x2160, 0x217F]      # 로마숫자 Ⅰ Ⅱ Ⅲ
    - [0x2460, 0x24FF]      # 원문자 ① ② ③
    - [0x2018, 0x201D]      # 따옴표
    - [0x2013, 0x2015]      # 대시
  allowed_chars: "·•※→←↔≪≫「」『』〈〉§¶†‡…‰°∼~№㈜㎡ⓐ*☑☐◎●○■□◇◆★☆"


# ─────────────────────────────────────────────────────────────
# 2.5 교재 범례 요소 (§1.5, §4.3~4.7)
# ─────────────────────────────────────────────────────────────
legend:
  # ⑩ 옆번호: 절 제목 우측 여백의 강의교안 번호 (사례집 번호 E-5 와 다른 체계)
  sidenote:
    # 옆번호를 어떻게 다룰지.
    #   drop 좌표로 떼어내고 버린다 (기본). 본문에 섞이는 것만 막는다.
    #   keep 떼어내서 헤딩 메타데이터로 남긴다
    #   off  떼어내지 않는다 (본문과 붙을 위험이 있다)
    mode: drop
    # TODO(진단): 옆번호가 있는 교재인지, 있다면 어떤 모양인지 확인한다.
    #   convert --config config-patent.yaml probe <PDF> --lines --pages 40-45
    # 옆번호가 없는 교재라면 이 무늬는 아무것도 맞히지 않으므로 그냥 두면 된다.
    # OCR 이 소문자 s 를 대문자 S 로 흘리기도 한다(SE-5). 둘 다 받는다.
    pattern: '^[sS][A-Z]-\d{1,3}$'
    # 본문 오른쪽 끝에서 이 비율보다 더 오른쪽에서 시작하는 블록을 여백으로 본다
    margin_ratio: 0.78
    # 옆번호를 어느 헤딩에 붙일지: 세로 거리가 이 안(pt)일 때만 같은 줄로 본다.
    # 넉넉히 잡으면 편·장 제목이 절의 옆번호를 가로챈다.
    match_tolerance: 12
    # 여백에서 뗀 뒤 남은 본문에서 다시 이 꼴이 보이면 병합 사고다 (§5.5)
    # sE-8 + '1.' → sE-81 꼴만 의심한다. sE-10, sO-52 는 정상 번호다.
    merge_suspect: '[sS][A-Z]-\d{3,}'

  # ⑨ 기출연도: 제목 뒤 (11) → 2011. 복수는 (15)(20)
  exam_year:
    pattern: '\((\d{2})\)'
    century_split: 50        # 50 이상이면 19xx, 미만이면 20xx

  # ⑧ 보너스 논점 박스
  bonus:
    marker: '☑'
    # ☑ 가 깨져 들어오는 꼴. 줄 맨 앞에 홀로 있을 때만 ☑ 로 되돌린다.
    misread: ['口', '囗', '☐', '▣', '■', 'ⓥ', 'Ⅴ', '느', '冈', '囚', '田']
    # 줄 맨 앞 '0 ' / 'V ' 도 오인식 후보로 본다 (뒤에 한글 제목이 올 때만)
    misread_ascii: ['0', 'V', 'v', 'ㅁ', 'ㅇ', 'O', 'D']
    # 오인식 글자와 제목 사이에 공백이 없기도 하다: '0실제로청구취지확장…'
    misread_needs_space: false
    # 오인식으로 볼 줄의 최대 길이. 이보다 길면 본문이다.
    misread_max_len: 44
    # 박스 한 개가 이보다 길면 박스가 아니라고 보고 끊는다
    max_lines: 24

  # ③ 판례 제목 라벨: 1) [청구확장 취지 명백히 표시] ... (91다43695*)
  case_label:
    pattern: '^(?:\d+\s*[).]|\(\s*\d+\s*\))\s*\[(?P<label>[^\]]{2,40})\]'

  # ① 논점 윤곽 띠: 절 상단의 의의-내용-예외-효과
  outline:
    # 절 상단의 '의의 - 내용 - 예외 - 효과 + 관련논점' 띠.
    # 실물에는 '& ' '◎ ' 같은 표시가 앞에 붙는다.
    separator: '[-–—>»/·+]'
    lead_marker: '^[&◎@※＆⊙○●\s]+'
    # TODO(진단): **이 파이프라인에서 제일 중요한 설정이다.** 같은 판형이면
    # 그대로 가고, 아니면 이 교재의 말로 새로 채워야 한다.
    # `convert audit-sections` 맨 윗줄 「목차 띠를 읽은 파일 N/M개」를 가장
    # 먼저 본다. 낮으면 다른 숫자는 볼 필요가 없다.
    #
    # 아래는 민소법 목록에 특허법 말을 더한 것이다. 표지(◎ &)가 있고 토막이
    # 셋 이상이면 낱말을 요구하지 않으므로, 목록이 완전하지 않아도 대개 걸린다.
    keywords: [의의, 내용, 요건, 예외, 효과, 관련논점, 취지, 절차, 범위, 한계,
               소송물, 기판력, 방식, 시기, 판단, 심리, 유형, 성질,
               신규성, 진보성, 산업상이용가능성, 특허요건, 선출원, 확대된선출원,
               명세서, 청구범위, 기재요건, 보정, 분할, 변경, 우선권, 국내우선권,
               조약우선권, 무효, 정정, 권리범위, 균등론, 침해, 실시, 간접침해,
               직무발명, 존속기간, 심판, 심결, 심결취소소송, 재심, 실시권,
               전용실시권, 통상실시권, 특허권, 발명, 성립성, 학설, 검토]
    min_items: 3
    # 표지(◎ & ※)가 붙어 있으면 토막이 둘뿐이어도 띠다. 실측 '◎ 의의-내용'
    # 이 셋이 아니라는 이유로 띠가 아니게 되어 절 제목으로 승격되었고,
    # 그 논점의 목차가 사라져 뒤 판정이 전부 어긋났다.
    min_items_marked: 2
    # 한 토막의 최대 길이. 이보다 길면 띠가 아니라 문장이다.
    max_item_len: 10
    # 아는 낱말이 최소 이만큼은 있어야 한다
    min_known: 1

# §4.6 사례집 추출 검수. **자동 치환하지 않는다.** 세어서 리포트에만 올린다.
extraction_qa:
  patterns:
    - {name: 청구, regex: '정구|정\s*\+\s*구|청\s*\+\s*구', note: '청구 오인식 의심'}
    - {name: 결과, regex: '졀과|걸과', note: '결과 오인식 의심'}
    - {name: 구한다, regex: '수한다', note: '구한다 오인식 의심'}
    - {name: 로마자, regex: '(?<![가-힣])[ⅰｉ](?=\s*\))', note: 'i) 체계 오인식 의심'}
    - {name: 判例, regex: '判列|判倒|判例\s*例', note: '判例 오인식 의심'}
  # 페이지당 이 건수를 넘으면 "파서를 바꿔라" 로 판정한다 (자동 치환 아님)
  swap_parser_threshold: 2

# ─────────────────────────────────────────────────────────────
# 3. 파서 프로파일 (§3.2)
# ─────────────────────────────────────────────────────────────
parsers:
  # 진단 결과 → 파서 우선순위
  by_diagnosis:
    text_single_column: [pymupdf, pymupdf4llm, marker]
    text_two_column: [pymupdf, mineru, marker]
    scanned: [paddleocr, upstage]

profiles:
  textbook:
    label: 기본서
    split: chapter          # 장(章) 단위
    # 장 제목이 본문에 없을 때(이 교재가 그렇다) 절 단위로 나누는데,
    # 'N. 학설' 같은 소절에서 자르면 학판검 세트가 갈라진다.
    # 논점 번호가 붙은 제목이 있으면 그것만 경계로 삼는다.
    # TODO(진단): 민소법 교재는 논점마다 세 자리 번호를 달았다('051 시효중단').
    # 특허법 교재가 그렇지 않으면 이 무늬는 아무것도 안 맞히고, 장 나누기가
    # 절 단위로 떨어진다. `convert probe <PDF> --lines` 로 확인해 고친다.
    split_prefer: '^\d{3}\s'
    split_max_bytes: 409600 # 400KB 넘으면 절 단위로 재분할 (§6.3)
    columns: 1              # 실물 확인 결과 1단 (§3.1)
    emphasis: true          # 색상 → 마크다운 강조 (§2.4)
    sidenote: true          # 우측 여백에서 떼어낸다. 남길지는 legend.sidenote.mode
    headings:
      - {level: 1, pattern: '^제\s*(\d+)\s*편(?![가-힣])'}
      - {level: 2, pattern: '^제\s*(\d+)\s*장(?![가-힣])'}
      - {level: 2, pattern: '^CHAPTER\s+(\d+)\b'}
      - {level: 3, pattern: '^제\s*(\d+)\s*절(?![가-힣])'}
      # TODO(진단): 민소법 교재는 논점마다 세 자리 번호를 달았다: '051 시효중단'.
      # 특허법 교재의 논점 번호 모양을 `probe --lines` 로 보고 고친다.
      - {level: 3, pattern: '^(\d{3})\s+(?![\d)])\S.{0,30}$'}
      # 구분점이 마침표만은 아니다. OCR 이 '•'(U+2022), '‧', '∙', '・' 로
      # 흘린다. '·'(U+00B7)와 생김새가 같아도 다른 글자다.
      - {level: 4, pattern: '^([ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]|[IVX]{1,5})\s*[.·•‧∙・]\s*'}
    # 로마숫자 제목 아래에서 'N.' 은 절이 아니라 굵은 소항목이다 (§6.1)
    # 번호 자리가 뭉개진 절 제목을 목차 띠로 되찾는다 (§6.1).
    # OCR 은 'I.' 을 '仁j', '।', 'H' 로 흘린다. 표에 하나씩 등록해서는 끝이
    # 없는데, 답은 이미 문서 안에 있다 — 논점 첫 줄의 목차 띠가 절 이름을
    # 다 적어 둔다. 앞의 한글 아닌 잡글자를 떼고 그 이름과 맞으면 절 제목이다.
    # **잡글자가 붙어 있을 때만** 본다. 없으면 '효과는 다음과 같다' 같은
    # 본문을 제목으로 오해한다.
    outline_heading: true
    outline_junk_max: 4      # 번호 자리에서 떼어 볼 잡글자 최대 길이
    outline_tail_max: 12     # 제목 뒤에 붙어도 되는 꼬리 ('및 취지', '(25)')

    # 이 교재에서만 'H' 를 II 의 오인식으로 본다. 사례집은 문제 묶음을
    # A~Q 글자로 세므로 'H' 를 로마자로 바꾸면 장 제목이 깨진다.
    roman_heads_extra:
      II: ['H']
    bold_item: '^(\d+)\s*\.\s*'
    # 절 제목으로 볼 'N.' (로마숫자 제목 앞에 나오고 줄이 짧을 때)
    section_item: '^(\d+)\s*\.\s*'
    section_max_len: 40
    # 각주를 모아 붙일 단위: 이 수준 이하 헤딩이 새로 시작하면 앞 각주를 쏟아낸다
    footnote_flush_level: 4
    # 헤딩 옆 사례집 참조: [sE-81] / (sE-81) / sE-81
    casebook_ref: '[\[(（]?\s*(s[A-Z]-\d+(?:\s*,\s*s?[A-Z]?-?\d+)*)\s*[\])）]?'

  casebook:
    label: 사례집
    split: group            # 문제 그룹(E, F...) 단위
    split_max_bytes: 0      # 재분할하지 않음
    columns: 1
    emphasis: true
    sidenote: false
    # §4.7 문제 지문 박스. 테두리 안이라 좌우 여백이 본문보다 안쪽으로 들어온다.
    prompt_box:
      indent_ratio: 0.04    # 본문보다 이 비율 이상 안쪽이면 박스로 본다
      max_lines: 40
    problem: '^([A-Z])\s*-\s*(\d+)\s*\.?\s*(.*)$'
    # 문제 지문 / 답안 구분 표지
    prompt_markers: [문제, 【문제】, "[문제]", 사례, 설문]
    answer_markers: [답안, 【답안】, "[답안]", 모범답안, 예시답안]
    answer_headings:
      - {level: 3, pattern: '^(\d+)\s*\.\s*'}
      - {level: 4, pattern: '^\(\s*(\d+)\s*\)\s*'}
    # 답안 헤딩으로 볼 최대 길이. 넉넉히 잡으면 '(1) 소가란 …금액을 의미한다.'
    # 같은 본문이 통째로 제목이 되어 빈 섹션이 쏟아진다.
    answer_heading_max_len: 40
    # 이렇게 끝나면 답안 목차가 아니라 문제의 설문이다.
    # 지문 박스 밖으로 새어 나온 설문이 헤딩이 되면 목차가 통째로 어긋난다.
    question_endings: [설명하시오, 논하시오, 검토하시오, 서술하시오, 답하시오,
                       기술하시오, 논하라, 설명하라, 하는가, 인가, 있는가,
                       없는가, 무엇인가, 누구인가, 타당한가]
    # 배점: (10점) / 10점 / [2.5] / (4) / 0.5 — 반드시 줄 끝에서만 본다.
    # 앞이 글자·숫자면 배점이 아니다. 이 조건이 없으면 '(74다1557)' 의 1557 을
    # 배점으로 뜯어내 사건번호를 부순다.
    score: '(?<![\w가-힣])[\[(（]?\s*(\d+(?:\.\d+)?)\s*(?:점)?\s*[\])）]?\s*$'
    # 배점으로 인정할 최대값. 이보다 크면 배점이 아니라고 본다.
    score_max: 50
    footnote_flush_level: 2

# ─────────────────────────────────────────────────────────────
# 사람이 확정한 정정 (§4.8 의 예외)
#
# 자동 교정은 하지 않는다. 다만 OCR 이 글자를 아예 삼켜 버려 프로그램이
# 되살릴 수 없는 것들이 있다. 예: '(2018다210539)' 의 여는 괄호와 연도 첫
# 자리가 함께 '仏' 로 뭉개져 '018다210539' 가 된 경우. 어느 연도인지는
# 원문을 본 사람만 안다.
#
# 여기에 적은 것만 바꾸고, 바꾼 자리는 02_changes.jsonl 과 warnings 에 남는다.
# find 는 정규식이 아니라 글자 그대로다.
# 비워 둔다. 민소법 설정에 적힌 정정들은 그 교재의 그 자리에서 사람이 원본과
# 대조해 확정한 것이라, 특허법 교재에 그대로 쓰면 없는 자리를 고치게 된다.
# `_reports/warnings.md` 와 `extraction_qa` 리포트를 보고 **원문을 편 사람이
# 확인한 것만** 한 줄씩 더한다.
corrections: []

# 목차 줄은 제목이 아니다. '.....188' 처럼 점선과 쪽번호로 끝난다.
# 이걸 안 거르면 목차 한 쪽이 통째로 문제 헤딩이 되어 빈 섹션이 쏟아진다.
toc:
  line: '\.{4,}\s*\d{1,4}\s*$|…{2,}\s*\d{1,4}\s*$'

# ─────────────────────────────────────────────────────────────
# 3.5 글자 뽑기
# ─────────────────────────────────────────────────────────────
extract:
  # 스캔본 OCR 레이어는 낱말 사이 공백을 글자로 넣어 주지 않는다. 글자 사이
  # 가로 간격이 글자 크기의 이 비율보다 벌어지면 공백을 넣는다.
  # 0 으로 두면 공백을 넣지 않는다(원문에 공백이 이미 있는 PDF).
  space_gap_ratio: 0.18
  # 같은 줄로 볼 세로 겹침 비율. OCR 은 '3' 과 '.判例' 를 다른 줄로 떨궈 놓는다.
  # 두 줄의 세로 범위가 이만큼 겹치면 한 줄로 잇고 x 순서로 늘어놓는다.
  line_merge_overlap: 0.55
  # 가로로 이만큼(쪽폭 대비) 떨어져 있으면 같은 줄이라도 잇지 않는다.
  # 제목 옆 여백의 장식 글자('己厂—I', '!')가 제목에 들러붙는 것을 막는다.
  line_merge_max_gap: 0.06

# ─────────────────────────────────────────────────────────────
# 4. 머리말·꼬리말 (본문이 아니므로 뺀다. 각주 영역과 혼동하지 않도록 상단만)
# ─────────────────────────────────────────────────────────────
running:
  strip_header: true
  strip_page_number: true
  header_zone: 0.08
  # 되풀이로 찾는다. 표본 쪽의 위·아래 띠에서 줄을 모아, 숫자를 뺀 모양이
  # 표본의 이 비율 이상에서 되풀이되면 머리말·꼬리말로 본다.
  # 쪽 크기가 책마다 달라 절대 위치만으로는 못 잡는다.
  detect_repeating: true
  repeat_zone: 0.12
  repeat_min_ratio: 0.15
  repeat_sample: 40
  # 쪽 아래 이 비율보다 아래에 있으면서 아래 무늬에 맞으면 꼬리말로 본다.
  # 각주가 이 위에 오므로 각주와 겹치지 않는다.
  footer_zone: 0.94
  # 각주 마지막 줄과 이만큼 넘게 떨어져 있으면 꼬리말로 본다 (보통 줄간격의 배수).
  # 각주는 촘촘히 붙어 있고 꼬리말은 그 아래로 한참 떨어져 있다. 무늬로는 못
  # 잡는다 — OCR 이 쪽마다 다르게 흘려 놓기 때문이다.
  footer_gap_ratio: 1.8
  # 위·아래 띠 안의 작고 짧은 줄은 머리말·꼬리말로 본다. OCR 이 쪽마다 다르게
  # 흘려 놓아('O과 己厂—I !') 무늬로도 되풀이로도 못 잡는 것들이 있다.
  # 본문은 이 자리에 이렇게 작고 짧게 서지 않는다. 제목 꼴은 남긴다.
  strip_small_in_band: true
  band_max_len: 40
  # 쪽 아래 띠에서는 한글이 이보다 적을 때만 '작고 짧은 줄' 규칙을 쓴다.
  # 아래는 각주가 차지하고 있다. 각주 뒷줄은 읽히는 한국어고, OCR 이 흘린
  # 꼬리말('O과 己厂—I !')은 한글이 거의 없다. 그것으로 가른다.
  band_max_hangul: 5
  footer_patterns:
    - '^\d{1,4}\s*[•·|｜]'          # 154•윤곽민사소송법
    - '[•·,，]\s*\d{1,4}\s*$'      # CHAPTER05|소송물•155 / Chapter E. 소송물 , 247
    - '^CHAPTER\s*\d+\s*[|｜]'
    - '^\d{1,4}$'                   # 쪽번호만
  # 자리를 가리지 않고 보는 무늬. **본문보다 작은 줄에만** 쓴다.
  # 장 제목 띠는 여백이 넉넉한 쪽에서 띠를 벗어나 앉는다. 그렇다고 띠를 넓히면
  # 본문을 먹으므로, 무늬가 확실한 것만 자리 없이 본다.
  #   · 'CHAPTER' 가 든 작은 줄은 장 제목 띠다. 진짜 장 제목은 본문보다 크다.
  #   · OCR 이 앞뒤에 잡글자를 붙여 놓아('O과 nr CHAPTER 6 소송절차 개시')
  #     앞을 고정할 수 없다.
  # 어떤 경우에도 절 제목이 되어서는 안 되는 줄. 머리말이 영역 판정을
  # 빠져나와 로마자 절 규칙('VIII •')에 걸리는 자리가 있다. 반복 횟수로는
  # 못 가른다 — 'I. 의의 및 취지' 도 논점마다 나와 77곳에 있다.
  # TODO(진단): **책 제목을 여기 적는다.** 안 적으면 머리말이 로마자 절
  # 규칙에 걸려 절 제목이 된다. 반복 횟수로는 못 가른다 — 'I. 의의 및 취지'
  # 도 논점마다 나와 수십 곳에 있다.
  # 진단 리포트의 머리말·꼬리말 표본에서 되풀이되는 문자열을 그대로 옮긴다.
  # 예: ['윤곽\s*특허법', '특허법\s*강의']
  never_heading: []

  footer_patterns_anywhere:
    - '(?i)\bchapter\b' 

# ─────────────────────────────────────────────────────────────
# 5. 검증 판정 기준 (§5.6)
# ─────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────
# 리포트
# ─────────────────────────────────────────────────────────────
report:
  # 두문자 결정표(§P1-3)에 뜰 쪽 그림 최대 개수. 종이를 봐야 어느 쪽이 옳은지
  # 알 수 있지만, 수백 장을 뜨면 폴더만 무거워진다.
  max_page_images: 40
  page_image_dpi: 130
  # §P0-2 폴백. 색을 못 읽은 쪽의 표준판례 판시를 그림으로 뜬다.
  max_emphasis_crops: 60
  crop_padding: 6

# ─────────────────────────────────────────────────────────────
# 기본서 ↔ 사례집 매핑 (mapping_생성지침.md)
# ─────────────────────────────────────────────────────────────
mapping:
  # 답안 목차 대조 (지침에 없는 근거 — README 「지침에서 벗어난 곳」 참조).
  # 사례집 답안 목차가 기본서 절 구조를 그대로 따라간다.
  #   'E-2 > 3. 일부청구 후 잔부청구 중복소제기 해당 여부' ↔ 'III. 중복소제기'
  # 실물에서 사건번호·두문자보다 판정력이 높다.
  answer_outline: true
  # 절 이름이 이보다 짧으면 답안 목차 대조를 인정하지 않는다.
  # '의의' '내용' '요건' '효과' 는 어느 장에나 있어서 다 걸린다. 실물 기준으로
  # 매핑 대상 절은 전부 3자 이상이었다 (소송물·중복소제기·시효중단·기판력).
  outline_min_len: 3
  # 답안 목차의 뼈대 말. 논점 이름이 아니라 답안 형식이라 대조에 못 쓴다.
  # 사례집이 없는 교재라면 mapping 단계 자체가 없다 (HANDOFF.md).
  outline_deny:
    ['학설', '검토', '사안', '判例', '판례', '문제점', '문제의 소재', '서설',
     '결론', '사안해결', '의의', '취지', '내용', '요건', '효과', '절차',
     '설문', '소결', '사안의 해결', '결어', '판단', '해설']
  # 문제 지문 끝의 총점. 실물은 제목이 아니라 지문 끝에 '(14점)' 으로 적는다.
  total_points: '\((\d+(?:\.\d+)?)\s*점\)'

validation:
  fail_on:
    case_format_errors: 0
    star_mismatch: 0
    mnemonic_mismatch: 0
    footnote_mismatch: 0
    # 표준판례(별표)가 있는 쪽의 강조(==) 최소 개수.
    # **0 이면 검사하지 않는다(기본).** 수정 요청 #01(개정)에서 색상 추출이
    # 취소되어 이 검사도 함께 내렸다. 색을 다시 살릴 때 5 쯤으로 켤 것.
    emphasis_per_standard_page: 0
  warn_on:
    noise_per_page: 3
  severity:
    # 목차 ↔ 실제 헤딩 대조 (§V1).
    #
    # 처음에는 FAIL 이었다. 절이 통째로 사라지는 사고를 잡으려던 것이고, 실제로
    # 48건을 잡아 냈다(로마자 I 가 데바나가리 단다로 읽힌 자리). 그 목적은
    # 달성했다.
    #
    # 남은 것은 성격이 다르다. **글자는 하나도 안 잃었다** — 절 제목이 헤딩
    # 대신 본문 문단으로 들어가 있을 뿐이다. 그래서 WARN 으로 둔다.
    # 다시 조이려면 FAIL 로 바꾼다.
    outline_missing: WARN

# ─────────────────────────────────────────────────────────────
# 6. 문단 잇기
#   space  줄 사이에 공백 하나 (기본)
#   none   붙인다 (원문에 없던 글자를 넣지 않아야 할 때)
#   break  줄바꿈 유지 (완전 무손실)
# ─────────────────────────────────────────────────────────────
paragraph:
  join: space
